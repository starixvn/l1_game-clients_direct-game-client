variables:
  NODEJS_IMAGE: hub.lumigame.com/base/node:20.9.0-alpine

include:
  - project: "ci/core-cicd"
    ref: main
    file: "luminet.gitlab-ci.yml"

mutation_test:
  image: $NODEJS_IMAGE
  stage: test
  script:
    - npm ci
    - npm run test:mutation
  # only:
  #   - merge_requests
  allow_failure: true
  artifacts:
    reports:
      junit: reports/mutation/mutation.xml
    paths:
      - reports/mutation
    expire_in: 1 week
