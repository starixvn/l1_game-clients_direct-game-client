variables:
  NODEJS_IMAGE: hub.lumigame.com/base/node:20.9.0-alpine

include:
  - project: "ci/core-cicd"
    ref: main
    file: "luminet.gitlab-ci.yml"

.mutation_test_template:
  image: $NODEJS_IMAGE
  stage: test
  tags:
    - ci
  before_script:
    - yarn install
  allow_failure: true
  artifacts:
    reports:
      junit: reports/mutation/$CI_JOB_NAME/mutation.xml
    paths:
      - reports/mutation/$CI_JOB_NAME
    expire_in: 1 week

mutation_test_shared_1:
  extends: .mutation_test_template
  script:
    - npx stryker run -c stryker.shared-1.json

mutation_test_shared_2:
  extends: .mutation_test_template
  script:
    - npx stryker run -c stryker.shared-2.json

mutation_test_components_1:
  extends: .mutation_test_template
  script:
    - npx stryker run -c stryker.components-1.json

mutation_test_components_2:
  extends: .mutation_test_template
  script:
    - npx stryker run -c stryker.components-2.json

mutation_test_app:
  extends: .mutation_test_template
  script:
    - npx stryker run -c stryker.app.json

mutation_test_report:
  image: $NODEJS_IMAGE
  stage: test
  needs:
    - mutation_test_shared_1
    - mutation_test_shared_2
    - mutation_test_components_1
    - mutation_test_components_2
    - mutation_test_app
  script:
    - |
      echo "Mutation Testing Summary:"
      echo "========================"
      for dir in reports/mutation/mutation_test_*/; do
        if [ -d "$dir" ]; then
          echo "Results from ${dir}:"
          cat "${dir}/mutation.xml" || echo "No results found in ${dir}"
          echo "------------------------"
        fi
      done
  artifacts:
    reports:
      junit:
        - reports/mutation/mutation_test_*/mutation.xml
    paths:
      - reports/mutation
    expire_in: 1 week
